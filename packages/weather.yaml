sun:

rest:
  # current tide https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=latest&station=9413450&product=ofs_water_level&datum=MLLW&time_zone=lst_ldt&units=english&format=json
  - authentication: basic
    scan_interval: 3600
    resource_template: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&station=9413450&datum=MLLW&time_zone=lst_ldt&units=english&interval=hilo&format=json&begin_date={{ now().strftime('%Y%m%d') }}&end_date={{ (as_timestamp(now())+ 86400) | timestamp_custom('%Y%m%d') }}"
    sensor:
      - name: "Tides"
        value_template: >
          {% set now = as_timestamp(now()) %}
          {% set tide = namespace(current=False, next=False) %}

          {% for prediction in value_json.predictions | reverse %}
            {% if not tide.current %}
              {% if as_timestamp(prediction.t) < now %}
                {% set tide.current = prediction %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% for prediction in value_json.predictions %}
            {% if not tide.next %}
              {% if as_timestamp(prediction.t) > now %}
                {% set tide.next = prediction %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {% if tide.next.type == "H" %}High{% else %}Low{% endif %} tide of {{ tide.next.v | round(1) }}' at {{ as_timestamp(tide.next.t) | timestamp_custom("%-I %p") }}

template:
  - sensor:
    - name: outside_temp
      default_entity_id: sensor.outside_temp  
      state: '{{ state_attr("weather.kmry_daynight", "temperature")|default(0) }}'
      unit_of_measurement: "°F"

  - sensor:
    - name: outside_forecast
      default_entity_id: sensor.outside_forecast
      icon: >
        {% set condition = states("weather.kmry_daynight") %}

        {%- if "cloud" in condition -%}
          mdi:weather-cloudy
        {%- elif "fog" in condition -%}
          mdi:weather-fog
        {%- elif "rain" in condition -%}
          mdi:umbrella-outline
        {%- elif "wind" in condition -%}
          mdi:weather-windy
        {%- else -%}
          mdi:weather-sunny
        {%- endif %}
      state: >
        {{ states("weather.kmry_daynight")|replace("-", " ")|replace("partlycloudy", "partly cloudy")|default("") }}
      

automation:
  - alias: "Severe Weather Alerts"
    mode: single
    trigger:
      - trigger: state
        entity_id: sensor.nws_alerts_alerts
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
    action:
      - variables:
          alerts: "{{ state_attr('sensor.nws_alerts_alerts', 'Alerts') }}"

      # notify in the UI
      - action: persistent_notification.create
        data:
          title: "⚠️ New Weather Alert"
          message: >-
            {% if alerts and alerts | length > 0 %}
              {{ alerts[0].Headline }}
              
              **Severity:** {{ alerts[0].Severity }}
              **Expires:** {{ alerts[0].Expires }}
              **Description:** 
              {{ alerts[0].Description }}
            {% else %}
              New weather alert received.
            {% endif %}

      # message phones
      - action: notify.phones
        data:
          title: "Beach"
          message: "{{ alerts[0].Headline if alerts and alerts | length > 0 else 'Unknown' }}"
          data:
            url: "/my-home/home"
            push:
              sound:
                name: "default"
                critical: 1
                volume: 0